  const style=getComputedStyle(probeLetter),font=style.fontWeight+' '+style.fontSize+' '+style.fontFamily;probe.font=font;
  const gap=Math.max(3,Math.min(7,dims.w*.004)),fontSize=parseFloat(style.fontSize);
  let lineOffset=0;
  const lines=nameLines.map(text=>{const line=glyphs.slice(lineOffset,lineOffset+text.length);lineOffset+=text.length;return line}).map(line=>line.map(g=>{const m=probe.measureText(g.char);return{g,m,width:(m.actualBoundingBoxLeft||0)+(m.actualBoundingBoxRight??m.width),height:(m.actualBoundingBoxAscent||fontSize*.8)+(m.actualBoundingBoxDescent||0)}}));
  const scale=Math.min(...lines.map(line=>(dims.w*.98-gap*(line.length-1))/line.reduce((sum,item)=>sum+item.width,0)));
  const maxHeight=Math.max(...lines.flat().map(item=>item.height));
  world=new SoftLetterWorld(dims.w,dims.h-105);
  lines.forEach((line,row)=>{
    const total=line.reduce((sum,item)=>sum+item.width*scale,0)+gap*(line.length-1);let cursor=(dims.w-total)/2;
    line.forEach(({g,m,width,height})=>{
      const w=width*scale,h=height/maxHeight*(dims.h-105)*.43;
      g.contours=texture(g.char,font,m,fontSize);g.body=world.add({index:g.index,x:cursor+w/2,y:(row?.735:.245)*(dims.h-105),w,h,contours:g.contours});
      const prior=previous?.bodies[g.index];
      if(prior){const co=Math.cos(prior.angle),si=Math.sin(prior.angle),x=prior.x/previous.width*world.width,y=prior.y/previous.height*world.height;for(const n of g.body.nodes){n.x=x+co*n.rx-si*n.ry;n.y=y+si*n.rx+co*n.ry}world.updateBody(g.body)}
      cursor+=w+gap;
    });
  });
  world.setAmbient(reduced?0:.85);
  render();
}
function render(){
  if(!world)return;

  surface.style.opacity=String(Math.max(0,Math.min(1,(.82-progress)/.32)));
  for(const g of glyphs){
    const side=g.index%4,tx=(side===0?-dims.w*.52:side===1?dims.w*.5:side===2?-dims.w*.18:dims.w*.18)*progress,ty=(side===2?-dims.h*.39:side===3?dims.h*.35:0)*progress;
    const path=toSVGPath(world.contours(g.body));
    g.el.setAttribute('d',path);g.el.setAttribute('transform','translate('+tx+' '+ty+')');
  }
}
function updateNavigation(){
  const range=Math.max(1,story.offsetHeight-stage.clientHeight);progress=reduced?1:Math.max(0,Math.min(1,(scrollY-story.offsetTop)/range));
  const ready=progress>.85;
  if(ready&&!menuWasReady)world.reset();menuWasReady=ready;
  menu.style.opacity=String(Math.max(0,Math.min(1,(progress-.45)/.35)));menu.classList.toggle('ready',ready);menu.inert=!ready;letters.inert=progress>.8;
  $('menuButton').hidden=!ready||scrollY<story.offsetTop+story.offsetHeight-80;$('bottom').inert=progress>.45;
  if(ready&&menuFocusPending){menuFocusPending=false;rows[selected].focus({preventScroll:true})}
  $('bottom').style.opacity=String(1-progress);
}
function frame(time){
  raf=0;updateNavigation();
  if(!reduced&&!document.hidden&&progress<.85&&world.isActive()){const dt=lastTime?Math.min(2,(time-lastTime)/16.667):1;world.step(dt*.5);world.step(dt*.5)}
  lastTime=time;render();
  if(!reduced&&!document.hidden&&progress<.85&&world.isActive())raf=requestAnimationFrame(frame);
}
function schedule(){if(!raf)raf=requestAnimationFrame(frame)}
window.addEventListener('scroll',()=>{world.release(true);schedule()},{passive:true});
window.addEventListener('resize',()=>{fitMenu();layout();lastTime=0;schedule()});
document.addEventListener('visibilitychange',()=>{lastTime=0;world.release(true);schedule()});
function point(e){const rect=stage.getBoundingClientRect();return{x:e.clientX-rect.left,y:e.clientY-rect.top}}
glyphs.forEach(g=>{
  let pointer=null,start=null;
  g.el.addEventListener('pointerdown',e=>{if(e.button!==0||progress>.8||world.drag)return;const p=point(e);pointer=e.pointerId;start=p;world.grab(g.body,p.x,p.y);g.el.setPointerCapture(pointer);schedule()});
  g.el.addEventListener('pointermove',e=>{if(pointer!==e.pointerId||world.drag?.body!==g.body)return;const p=point(e);world.move(p.x,p.y);schedule()});
  const release=e=>{if(pointer!==e.pointerId)return;pointer=null;if(world.drag?.body!==g.body)return;const p=point(e),click=Math.hypot(p.x-start.x,p.y-start.y)<5;world.release(e.type!=='pointerup');if(click&&e.type==='pointerup'){world.nudge(g.body)}schedule()};
  g.el.addEventListener('keydown',e=>{const moves={ArrowLeft:[-2,0],ArrowRight:[2,0],ArrowUp:[0,-2],ArrowDown:[0,2]};if(moves[e.key]){e.preventDefault();const [x,y]=moves[e.key],scale=e.shiftKey?3:1;world.nudge(g.body,x*scale,y*scale);schedule()}else if(e.key==='Enter'||e.key===' '){e.preventDefault();world.nudge(g.body);schedule()}else if(e.key==='Escape'){world.reset();render();schedule()}});
  g.el.addEventListener('pointerup',release);g.el.addEventListener('pointercancel',release);g.el.addEventListener('lostpointercapture',release);
});
motionPreference.addEventListener('change',e=>{reduced=e.matches;lastTime=0;world.release(true);world.setAmbient(reduced?0:.85);schedule()});
window.ElasticPortfolio={nudgeLetters(){glyphs.forEach((g,i)=>world.nudge(g.body,(i%2?1:-1)*2,-2));schedule()},openLinks(){setFaceLinks(true)},showAbout(){choose(bioIndex,{detail:1})}};
layout();updateNavigation();render();schedule();

})();
</script>
